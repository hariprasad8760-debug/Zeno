<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zeno AI Assistant</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 340px;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-info h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .control-info p {
      font-size: 11px;
      color: var(--text-muted);
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: 0.3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .info-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #c7d2fe;
      line-height: 1.4;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #4f46e5;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="brain_logo.png" alt="Zeno">
      <span class="brand-name">Zeno AI Assistant</span>
    </div>
    <div class="status-badge" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Active</span>
    </div>
  </div>

  <div class="control-card">
    <div class="control-info">
      <h4>Floating Assistant</h4>
      <p id="agent-desc">Visible across all web pages</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="agent-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="info-box">
    ⚡ <strong>Agent Mode:</strong> Floating widget is enabled on all web tabs. Click the floating sphere on any webpage to analyze code, ask questions, or take screenshots!
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="open-web-btn">Open Zeno Web</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
